  /* aurora: 3 bade soft blobs, sirf transform (GPU) */

  .aurora b{position:absolute;width:75vmax;height:75vmax;border-radius:50%;opacity:.6;

  .aurora b:nth-child(2){--a:rgba(40,220,255,.36);--t:32s;top:-20vmax;right:-42vmax;animation-delay:-9s}
  .aurora b:nth-child(3){--a:rgba(110,90,255,.50);--t:29s;bottom:-44vmax;left:-10vmax;animation-delay:-15s}
  @keyframes drift{
    from{transform:translate3d(0,0,0) scale(1)}

  /* sparkles: halke twinkle */

    animation:twinkle var(--t,4s) ease-in-out var(--d,0s) infinite}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.15)}}

  /* bubbles: sirf transform+opacity (GPU), fixed 9 elements, koi JS nahi */
  .bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;contain:strict}
  .bg i{position:absolute;bottom:-160px;left:var(--l);width:var(--s);height:var(--s);border-radius:50%;
    background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.8) 0 5%,rgba(255,255,255,.22) 15%,rgba(255,255,255,.05) 58%,rgba(120,220,255,.28) 100%);
    border:1px solid rgba(255,255,255,.4);

  @media (max-height:700px){.chips{display:none}.float span:nth-child(n+6){display:none}}

    .waves svg,.float span,.shoot s,.badge,.card::before{animation:none}

</style>

<script>
const SITE = "https://fastai-rs6i.onrender.com";
const TOTAL = 60;
const $ = id => document.getElementById(id);
let done = false, fails = 0;
const t0 = Date.now();

function go(){ if(done) return; done = true; $("h").textContent = "Ready! 🚀"; $("status").textContent = "Eko khul raha hai .."; location.replace(SITE); }

// countdown: 1 baar per second (pehle 4 baar/sec tha)
const STAGES = [[0,"Server ko jagaya ja raha hai ✨"],[15,"Eko tayyar ho raha hai .."],[40,"Bas thodi der aur .."]];
let stage = 0;
function tick(){
  const el = Math.floor((Date.now()-t0)/1000), left = Math.max(0, TOTAL-el);
  $("sec").textContent = Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  let s = 0; STAGES.forEach((x,i)=>{ if(el>=x[0]) s = i; });
  if(s !== stage || el === 0){
    stage = s; $("status").textContent = STAGES[s][1];
    document.querySelectorAll(".steps b").forEach((b,i)=>b.classList.toggle("on", i<=s));
  }
  if(left === 0 && !done) $("h").textContent = "Almost there ..";
}
setInterval(tick, 1000); tick();

// tips (sirf text + opacity)
const TIPS = [
  "Tip: Eko se maths ke sawal step-by-step solve karwao.",

  "Tip: Interview ki practice Eko ke saath karo, confidence badhega.",

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// tips aur facts ek-ek karke mix, har baar naya order
const MIX = (function(){ const t=shuffle(TIPS), f=shuffle(FACTS), o=[]; for(let i=0;i<Math.max(t.length,f.length);i++){ if(t[i]) o.push(t[i]); if(f[i]) o.push(f[i]); } return o; })();
let ti = 0; const tipEl = $("tip");
function showTip(){ tipEl.style.opacity = 0; setTimeout(()=>{ tipEl.textContent = MIX[ti++ % MIX.length]; tipEl.style.opacity = .9; }, 400); }
showTip(); setInterval(showTip, 5000);

// Server ping: har 1.5 sec me ping, ready hote hi redirect
const PING_EVERY = 1500, PING_TIMEOUT = 5000, MAX_INFLIGHT = 3;
let inflight = 0, loop = null, corsOK = true, opaqueHits = 0;

async function ping(){
  if(done || inflight >= MAX_INFLIGHT) return;
  inflight++;
  const c = new AbortController(), to = setTimeout(()=>c.abort(), PING_TIMEOUT);
  try{
    if(corsOK){
      // Proper check: server ne CORS allow kiya ho to /ping ka "ok" verify hota hai
      const r = await fetch(SITE+"/ping?t="+Date.now(), {cache:"no-store", signal:c.signal});
      if(r.ok && (await r.text()).trim() === "ok"){ fails = 0; return go(); }
      fails++;                       // server jaag raha hai par abhi ready nahi (503 etc.)
    }else{
      // Fallback: CORS nahi hai -> no-cors se sirf "server ne jawab diya" pata chalta hai
      await fetch(SITE+"/ping?t="+Date.now(), {mode:"no-cors", cache:"no-store", signal:c.signal});
      if(++opaqueHits >= 2) return go();   // 2 baar jawab mila -> open
    }
  }catch(e){
    // CORS error aur network error dono TypeError hote hain -> ek baar fallback try karo
    if(e.name === "TypeError" && corsOK && fails === 0 && !c.signal.aborted){
      try{
        await fetch(SITE+"/ping?t="+Date.now(), {mode:"no-cors", cache:"no-store", signal:c.signal});
        corsOK = false; opaqueHits = 1;   // server reachable hai, bas CORS band hai
      }catch(_){ fails++; }
    }else{ fails++; }
  }finally{
    clearTimeout(to); inflight--;
    $("net").style.display = fails >= 4 ? "block" : "none";
  }
}
function start(){ clearInterval(loop); ping(); loop = setInterval(ping, PING_EVERY); }
start();

// tab background me ho to wapas aate hi turant check
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !done) start(); });
</script>
