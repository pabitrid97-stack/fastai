<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Eko ..</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,Arial,sans-serif;color:#fff;
    background:linear-gradient(150deg,#1d0f5e 0%,#0b3b7a 50%,#0a6a7a 100%)}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;z-index:2;padding:20px;box-sizing:border-box}
  .orb{width:96px;height:96px;border-radius:50%;margin-bottom:22px;
    background:radial-gradient(circle at 30% 30%,#fff,#7ff3ff 40%,#8b5cf6 80%);
    box-shadow:0 0 40px rgba(127,243,255,.7),0 0 90px rgba(139,92,246,.5);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 60px rgba(127,243,255,.9),0 0 120px rgba(139,92,246,.7)}}
  h1{margin:0 0 6px;font-size:1.7rem;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  #sec{font-size:2.4rem;font-weight:700;margin:6px 0;font-variant-numeric:tabular-nums}
  #tip{max-width:320px;min-height:44px;opacity:.9;font-size:.95rem;margin:10px 0 0;transition:opacity .4s}
  .b{position:absolute;bottom:-120px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75),rgba(127,243,255,.25) 45%,rgba(139,92,246,.2));
    border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 0 12px rgba(255,255,255,.35);animation:rise linear forwards}
  @keyframes rise{to{transform:translateY(-130vh) translateX(var(--dx));opacity:.9}}
</style>
</head>
<body>
<div class="wrap">
  <div class="orb"></div>
  <h1 id="h">Starting Eko ..</h1>
  <div id="sec">1:00</div>
  <div id="tip"></div>
</div>
<script>
// Aapki Render site
const SITE = "https://fastai-rs6i.onrender.com";

// Bubbles niche se upar
function bubble(){
  const el=document.createElement("div"); el.className="b";
  const s=14+Math.random()*60;
  el.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}vw;--dx:${Math.random()*80-40}px;animation-duration:${4+Math.random()*5}s`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),10000);
}
setInterval(bubble,220);
for(let i=0;i<10;i++) setTimeout(bubble,i*120);

// 1 minute countdown (site jaagte hi turant khul jayegi, timer ka intezaar nahi)
const t0=Date.now(), TOTAL=60;
setInterval(()=>{
  const left=Math.max(0,TOTAL-Math.floor((Date.now()-t0)/1000));
  const m=Math.floor(left/60), sc=String(left%60).padStart(2,"0");
  document.getElementById("sec").textContent=m+":"+sc;
  if(left===0 && !done) document.getElementById("h").textContent="Almost there ..";
},250);

// Tips / fun facts
const TIPS=[
  "Tip: Eko se maths ke sawal step-by-step solve karwao.",
  "Fun fact: Shahad kabhi kharab nahi hota.",
  "Tip: Photo ya file attach karke bhi sawal pooch sakte ho.",
  "Fun fact: Octopus ke 3 dil hote hain.",
  "Tip: Practice questions se padhai pakki hoti hai."
];
let ti=0; const tipEl=document.getElementById("tip");
function showTip(){tipEl.style.opacity=0;setTimeout(()=>{tipEl.textContent=TIPS[ti++%TIPS.length];tipEl.style.opacity=.9;},400);}
showTip(); setInterval(showTip,5000);

// Server ko jagao + jaise hi ready ho, turant redirect
let done=false;
async function check(){
  if(done) return;
  const started=Date.now();
  try{
    const c=new AbortController(); setTimeout(()=>c.abort(),6000);
    const r=await fetch(SITE+"/ping?t="+Date.now(),{cache:"no-store",signal:c.signal});
    if(r.ok && (await r.text()).trim()==="ok"){
      done=true;
      location.replace(SITE);
      return;
    }
  }catch(e){}
  setTimeout(check,Math.max(0,1500-(Date.now()-started)));
}
check();
</script>
</body>
</html>
